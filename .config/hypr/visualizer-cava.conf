[general]
framerate = 60
bars = 64
autosens = 1
# Avoid CAVA's once-per-second wakeup checks after silence.
sleep_timer = 0

[input]
# Monitor the default playback sink through pipewire-pulse, never the microphone.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# Preserve amplitude detail for normalization in either renderer.
ascii_max_range = 65535
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
# Spatial smoothing comes from the renderer; avoid a delayed audio envelope.
noise_reduction = 20
