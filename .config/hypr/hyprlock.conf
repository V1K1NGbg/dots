# Charcoal, cyan and Monocraft, matching the desktop and Rofi.
general {
    hide_cursor = true
    immediate_render = true
    fail_timeout = 1500
}

auth {
    pam:enabled = true
    # Arch's stock hyprlock service includes login. Use that same password
    # stack directly, avoiding the old pam_fprintd line in /etc/pam.d/hyprlock.
    pam:module = login
    fingerprint:enabled = true
    fingerprint:retry_delay = 500
}

background {
    monitor =
    path = screenshot
    color = rgb(191919)
    blur_passes = 2
    blur_size = 4
    noise = 0.015
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.08
    vibrancy_darkness = 0.05
}

# A quiet, translucent panel keeps text legible over any desktop.
shape {
    monitor =
    size = 420, 260
    color = rgba(191919a6)
    rounding = 6
    border_size = 2
    border_color = rgba(67ffebaa)
    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(00000066)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $TIME
    color = rgb(67ffeb)
    font_family = Monocraft Nerd Font
    font_size = 44
    position = 0, 70
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgb(b3bfbc)
    font_family = Monocraft Nerd Font
    font_size = 10
    position = 0, 23
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = rgb(f8f8f2)
    font_family = Monocraft Nerd Font
    font_size = 13
    position = 0, -10
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 340, 42
    outline_thickness = 2
    rounding = 6
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = rgba(67ffeb88)
    inner_color = rgba(242424b3)
    font_color = rgb(f8f8f2)
    fail_color = rgb(ff6685)
    check_color = rgb(67ffeb)
    capslock_color = rgb(f2c879)
    fade_on_empty = false
    placeholder_text = Password  ↵
    # Show the latest authentication error in place of the input placeholder.
    fail_text = <span size="10pt">$FAIL</span>
    font_family = Monocraft Nerd Font
    position = 0, -54
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(8b9996)
    font_family = Monocraft Nerd Font
    font_size = 10
    position = 0, -103
    halign = center
    valign = center
    zindex = 1
}
