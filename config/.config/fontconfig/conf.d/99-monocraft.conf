<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep the requested families as fallbacks for missing glyphs. -->
  <match target="pattern">
    <test name="family" compare="not_contains"><string>Emoji</string></test>
    <test name="family" compare="not_contains"><string>emoji</string></test>
    <test name="family" compare="not_contains"><string>Awesome</string></test>
    <test name="family" compare="not_contains"><string>Symbols</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Monocraft Nerd Font</string>
    </edit>
  </match>
</fontconfig>
