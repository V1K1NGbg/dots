general {
    lock_cmd = pidof hyprlock || hyprlock
    # If hyprlock dies while the session stays locked, power.sh restarts it
    # instead of leaving Hyprland's lock-dead screen behind.
    on_lock_cmd = bash ~/.config/hypr/scripts/power.sh watch-lock
    before_sleep_cmd = loginctl lock-session; playerctl --all-players pause 2>/dev/null
    after_sleep_cmd = playerctl --all-players pause 2>/dev/null; bash ~/.config/hypr/scripts/power.sh resume
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = bash ~/.config/hypr/scripts/power.sh idle battery
    on-resume = bash ~/.config/hypr/scripts/power.sh resume
}

listener {
    timeout = 900
    on-timeout = bash ~/.config/hypr/scripts/power.sh idle ac
    on-resume = bash ~/.config/hypr/scripts/power.sh resume
}
