general {
    hide_cursor = true
    immediate_render = true
    fail_timeout = 1500
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

background {
    monitor =
    path = screenshot
    color = rgb(191919)
    blur_passes = 1
    blur_size = 3
    noise = 0.0
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.04
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = $TIME
    color = rgb(67ffeb)
    font_family = Monocraft Nerd Font
    font_size = 52
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(f8f8f2)
    font_family = Monocraft Nerd Font
    font_size = 18
    position = 0, 42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgb(67ffeb)
    inner_color = rgba(191919aa)
    font_color = rgb(f8f8f2)
    fail_color = rgb(ff025f)
    check_color = rgb(a2f300)
    placeholder_text = <span foreground="##404040">Password or fingerprint</span>
    fail_text = <span foreground="##ff025f">Authentication failed</span>
    font_family = Monocraft Nerd Font
    position = 0, -45
    halign = center
    valign = center
}
