# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split panes: | side by side, _ top and bottom
bind | split-window -h
bind _ split-window -v
unbind '"'
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# clock mode
setw -g clock-mode-colour colour10

# pane borders
set -g pane-border-style 'fg=colour0'
set -g pane-active-border-style 'fg=colour4'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour0'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour15 bg=colour0 bold'
setw -g window-status-current-format ' #P #W '

setw -g window-status-bell-style 'fg=colour0 bg=colour4 bold'

# messages
set -g message-style 'fg=colour0 bg=colour4 bold'

# xterm colors
set -g default-terminal "tmux-256color"

# Balance neighboring panes without changing split directions.
set-hook -g after-split-window 'select-layout -E'
set-hook -g after-kill-pane 'select-layout -E'
set-hook -g pane-exited 'select-layout -E'

# Ctrl-a, then Shift-H/J/K/L: resize by five cells; = restores even spacing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind = select-layout -E

# Ctrl-a, then h/j/k/l: move between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R